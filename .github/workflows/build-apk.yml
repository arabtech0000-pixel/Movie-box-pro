name: Build MovieBox Pro Native Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Generate PWA Icons & Build Web Dist
        run: |
          node scripts/generate_pwa_icons.js
          npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          cmdline-tools-version: latest

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Initialize and Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android
          if [ -d "android" ]; then
            echo "sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}" > android/local.properties
            chmod +x android/gradlew
          fi

      - name: Build Android APK
        run: |
          if [ -d "android" ]; then
            cd android
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload Built APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MovieBoxPro-Android-APK
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

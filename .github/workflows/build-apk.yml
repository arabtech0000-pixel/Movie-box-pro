name: Build MovieBox Pro Native Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Generate PWA Icons & Build Web Dist
        run: |
          node scripts/generate_pwa_icons.js
          npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Capacitor Android Platform
        run: |
          npx @capacitor/cli init "MovieBox Pro" "com.moviebox.pro.app" --web-dir dist
          npx @capacitor/cli add android || true
          npx @capacitor/cli copy android

      - name: Build Android Release APK
        run: |
          if [ -d "android" ]; then
            cd android && ./gradlew assembleDebug
          fi

      - name: Upload Built APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MovieBoxPro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

name: Build MovieBox Pro Native Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Generate PWA Icons & Build Web Dist
        run: |
          node scripts/generate_pwa_icons.js
          npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configure Android SDK & Accept Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | sdkmanager --licenses || true

      - name: Initialize and Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android
          if [ -d "android" ]; then
            echo "sdk.dir=$ANDROID_HOME" > android/local.properties
            chmod +x android/gradlew
          fi

      - name: Build Android APK
        run: |
          if [ -d "android" ]; then
            cd android
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload Built APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MovieBoxPro-Android-APK
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

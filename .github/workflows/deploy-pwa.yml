name: Build & Verify MovieBox Pro App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci || npm install
      - run: node scripts/generate_pwa_icons.js
      - run: npm run lint
      - run: npm run build

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090a0f"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00df82"/>
      <stop offset="100%" stop-color="#00b464"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00df82" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Movie Play Badge -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="256" r="140" fill="#121422" stroke="url(#accentGrad)" stroke-width="6"/>
    <path d="M210 170 L340 256 L210 342 Z" fill="url(#accentGrad)"/>
  </g>
  
  <!-- Film Roll Accents -->
  <circle cx="160" cy="130" r="12" fill="#00df82" opacity="0.8"/>
  <circle cx="352" cy="130" r="12" fill="#00df82" opacity="0.8"/>
  <circle cx="160" cy="382" r="12" fill="#00df82" opacity="0.8"/>
  <circle cx="352" cy="382" r="12" fill="#00df82" opacity="0.8"/>
</svg>

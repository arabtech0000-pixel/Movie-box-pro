    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MOVIEBOXPRO"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-MOVIEBOXPRO', { 'send_page_view': true });

      // Gracefully prevent Vite HMR WebSocket send errors in iframe preview
      window.addEventListener('error', function(e) {
        if (e && e.message && (e.message.includes("reading 'send'") || e.message.includes('WebSocket') || e.message.includes('@vite/client'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && String(e.reason).includes("reading 'send'")) {
          e.preventDefault();
        }
      });
    </script>
